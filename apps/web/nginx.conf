# Serves the Vite-built SPA (see apps/web/Dockerfile). nginx-unprivileged's
# base config already listens on 8080 as its own non-root user; this file
# replaces its default server block.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening; kept intentionally simple. A Content-Security-Policy
    # is left out because Vuetify injects its theme as an inline
    # <style id="vuetify-theme-stylesheet"> tag at runtime, which a
    # style-src without 'unsafe-inline' (or a per-response nonce, which a
    # static file server cannot generate) would block.
    #
    # nginx's add_header does not inherit into a location that sets its own
    # add_header, so these two are repeated in every location below instead
    # of declared once here.

    # Hashed assets (content-addressed filenames from the Vite build) never
    # change contents under the same URL, so they can be cached indefinitely.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html names the current hashed assets, so it must always be
    # revalidated: caching it would pin visitors to a stale deployment.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # SPA history-mode fallback: an unknown path (e.g. a deep link like
    # /invite) still serves index.html so vue-router can resolve the route
    # client-side, instead of a raw 404 from nginx.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
