# Runs the application locally in containers: the API and the web frontend.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      # Published on localhost only: this file is for local runs.
      - "127.0.0.1:8080:8080"
    environment:
      # Production configuration, with the frontend origin passed explicitly
      # instead of coming from appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: http://localhost:5173
    # Restarts the container when the process exits. Compose does not restart an
    # unhealthy container: the healthcheck only reports the status.
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl or wget: bash's /dev/tcp sends a plain
      # HTTP request to /health and checks for a 200 status line. The port must
      # match ASPNETCORE_HTTP_PORTS in apps/api/Dockerfile.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080
          && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Baked into the bundle at build time: the browser calls the API on the
        # host through its published port, not through the compose network.
        VITE_API_URL: http://localhost:8080
    ports:
      # Port 5173 on the host keeps the origin allowed by the API's CORS policy.
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    # Health status comes from the HEALTHCHECK in apps/web/Dockerfile.
    restart: unless-stopped
