# Runs the application locally in containers. The `web` service is added by the
# `frontend-ui` feature.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Production configuration, with the frontend origin passed explicitly
      # instead of coming from appsettings.Development.json.
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins__0: http://localhost:5173
    restart: unless-stopped
    healthcheck:
      # The runtime image has no curl or wget: bash's /dev/tcp sends a plain
      # HTTP request to /health and checks for a 200 status line.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080
          && printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3
          && head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
